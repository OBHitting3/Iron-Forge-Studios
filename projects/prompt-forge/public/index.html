<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Forge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      font-size: 2rem;
      color: #ffd600;
      margin-top: 40px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 40px;
      font-size: 0.95rem;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 20px;
      font-size: 1.1rem;
      font-family: inherit;
      background: #1a1a1a;
      color: #e0e0e0;
      border: 2px solid #333;
      border-radius: 12px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.6;
    }

    textarea:focus {
      border-color: #ffd600;
    }

    textarea::placeholder {
      color: #555;
    }

    button {
      display: block;
      width: 100%;
      padding: 16px;
      margin-top: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      background: #ffd600;
      color: #000;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #ffe033; }
    button:active { background: #ccab00; }
    button:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
    }

    .output {
      margin-top: 32px;
      padding: 24px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      white-space: pre-wrap;
      font-size: 0.95rem;
      line-height: 1.7;
      display: none;
    }

    .output.visible { display: block; }

    .output h2 {
      color: #ffd600;
      font-size: 1rem;
      margin-top: 16px;
      margin-bottom: 4px;
    }

    .output h2:first-child { margin-top: 0; }

    .copy-btn {
      display: inline-block;
      width: auto;
      padding: 10px 24px;
      margin-top: 12px;
      font-size: 0.9rem;
      background: #222;
      color: #ffd600;
      border: 1px solid #ffd600;
    }

    .copy-btn:hover { background: #2a2a00; }

    .status {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #888;
      text-align: center;
    }

    .error { color: #ff4444; }

    @media (max-width: 600px) {
      h1 { font-size: 1.5rem; }
      textarea { min-height: 140px; font-size: 1rem; padding: 16px; }
      button { font-size: 1rem; padding: 14px; }
    }
  </style>
</head>
<body>
  <h1>Prompt Forge</h1>
  <p class="subtitle">Say what you want. Get a prompt an AI can actually use.</p>

  <div class="container">
    <textarea id="input" placeholder="Type or paste whatever you're thinking. Messy is fine. Stream of consciousness is fine. I'll turn it into something an AI can act on."></textarea>

    <button id="translate" onclick="forge()">Forge It</button>

    <div class="status" id="status"></div>

    <div class="output" id="output"></div>
  </div>

  <script>
    async function forge() {
      const input = document.getElementById('input').value.trim();
      if (!input) return;

      const btn = document.getElementById('translate');
      const status = document.getElementById('status');
      const output = document.getElementById('output');

      btn.disabled = true;
      btn.textContent = 'Forging...';
      status.textContent = 'Thinking...';
      status.className = 'status';
      output.className = 'output';

      try {
        const res = await fetch('/api/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Something went wrong.');
        }

        // Render the prompt with basic markdown-style headers
        let html = data.prompt
          .replace(/^## (.+)$/gm, '<h2>$1</h2>')
          .replace(/^---$/gm, '');

        output.innerHTML = html + '<br><button class="copy-btn" onclick="copyPrompt()">Copy Prompt</button>';
        output.className = 'output visible';
        status.textContent = 'Done. Copy it and paste into any AI tool.';

      } catch (err) {
        status.textContent = err.message;
        status.className = 'status error';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Forge It';
      }
    }

    function copyPrompt() {
      const output = document.getElementById('output');
      // Get text content without the button
      const clone = output.cloneNode(true);
      clone.querySelectorAll('button').forEach(b => b.remove());
      const text = clone.textContent.trim();

      navigator.clipboard.writeText(text).then(() => {
        const btn = output.querySelector('.copy-btn');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy Prompt', 2000);
      });
    }

    // Allow Ctrl+Enter to submit
    document.getElementById('input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        forge();
      }
    });
  </script>
</body>
</html>
